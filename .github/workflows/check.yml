# CI for the org plugin: generator, hook and dependabot-policy tests, generated-file drift, ShellCheck.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests (generator, session hook, dependabot-policy)
        run: bash tests/run.sh
      - name: Generated files are current
        run: bin/generate --check
      - name: Install ShellCheck 0.11.0 (pinned, sha256-checked)
        run: |
          f=shellcheck-v0.11.0.linux.x86_64.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/$f"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: ShellCheck
        run: shellcheck -S warning bin/generate plugins/setkernel/hooks/*.sh tests/run.sh
      - name: JSON is valid
        run: for f in .claude-plugin/marketplace.json plugins/setkernel/.claude-plugin/plugin.json plugins/setkernel/hooks/hooks.json managed/*.json policy/versions.json; do jq empty "$f"; done
