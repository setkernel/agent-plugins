{
  "$comment": "setkernel's merge risk classes (hq#210): which class, R0 to R3, a PR is. The class is the highest any rule gives; every changed path counts, and so does a rename's old path. R3: a path matching r3.floor (decision 0006's floor), r3.global (hq#205), r3.policy or the repo's deny, case-insensitively; an r3.auth_words word inside any path segment; a path outside the repo's only; every path in an r3.repos repo; a symlink, a submodule or a mode change at base or head; a control character in a path; no changed files, or 300 or more (the compare API's cut-off). R2: what no R3 rule takes and R0 and R1 don't cover: more than limits.files files or limits.lines lines, a file that is no doc, test or code file, a test deleted or renamed away, or code past R1. R1: R0 plus at most limits.code_files code files, each modified with a line diff, at most limits.code_lines lines together. R0: docs and tests only. Patterns are tiered_merge.py's globs. Written as JSON so jq, Python and the sk-ctl Worker read it with no YAML parser; YAML 1.2 reads it too. bin/check-policy validates it, keeps 0006's and hq#205's patterns in R3, and runs policy/risk-cases.json. A change to this file is R3.",
  "version": 1,
  "limits": {"files": 20, "lines": 1000, "code_files": 3, "code_lines": 40},
  "categories": {
    "$comment": "Decision 0006's doc, test and code files (tiered_merge.py:59-63). Tests are checked first, then docs; a file with a code extension is never a doc. A repo's docs, tests and code extras add to these and still lose to every R3 rule.",
    "docs": [
      "**/*.md", "LICENSE*", "NOTICE*", "**/docs/**/*.txt", "**/docs/**/*.png", "**/docs/**/*.jpg",
      "**/docs/**/*.jpeg", "**/docs/**/*.gif", "**/docs/**/*.webp"
    ],
    "tests": [
      "**/test/**", "**/tests/**", "**/__tests__/**", "**/e2e/**", "**/*.test.*", "**/*.spec.*",
      "**/test_*.py", "**/*_test.py", "**/*_test.go", "**/test-*.sh"
    ],
    "code_extensions": [
      ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".py", ".go", ".rs", ".php", ".rb", ".java", ".kt",
      ".swift", ".c", ".h", ".cpp", ".cs", ".css", ".scss", ".html", ".svelte", ".vue", ".astro"
    ]
  },
  "r3": {
    "$comment": "repos: every path in these repos is R3. floor: decision 0006's global deny (tiered_merge.py:39-52). auth_words: matched as a substring of any path segment (tiered_merge.py:53). global: hq#205's global deny (proposed-policy.json:12-56), each word as a file and as a directory. policy: policy files in any repo (hq#210).",
    "repos": [
      "setkernel-cloudflare", "tesolutions-cloudflare", "wesi-cloudflare", "cloudflare-estate",
      "microsoft-estate", "tesolutions-microsoft", "wesi-microsoft", "agent-plugins", "agent-kit",
      "runner-image", ".github", ".github-private", "merge-gate", "sk-ctl", "evidence"
    ],
    "floor": [
