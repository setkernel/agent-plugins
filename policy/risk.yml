  "flags": {
    "tests_and_code": "The diff changes a test file (a rename's old path counts) and a code file. Not a class: hq#210 asks for an extra critic pass on these at R1 and above, and sk-ctl's gate computes the same flag."
  },
  "quorum": {
    "$comment": "What each class needs before the gate merges it, all on the same head commit with the branch up to date (0007 §2). Approvals count only from autonomy.json's people, and never from the author, anyone who wrote, committed or pushed a commit in the PR, the owner's seat, or a bot. No class requires a Codex review (0007 md:401-402). R1's two approvals are the interim quorum (hq#210 decision 3). owner-r3-approval is Raghav's R3 approval under hq#210's trust rule (his user id) until hq#212's confirmation replaces it (hq#209 decision 15).",
    "approvers": {"from": "people", "never": ["author", "committer", "pusher", "owner", "bot"]},
    "classes": {
      "R0": {"evidence": "green", "approvals": 1, "extra": []},
      "R1": {"evidence": "green-on-merge-candidate", "approvals": 2, "extra": []},
      "R2": {"evidence": "green", "approvals": 2, "extra": ["visual-diff", "rollback-note", "canary"]},
      "R3": {"evidence": "green", "approvals": 2, "extra": ["owner-r3-approval"]}
    }
  },
